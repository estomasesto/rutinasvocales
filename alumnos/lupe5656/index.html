<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rutinas Vocales - Lupe</title>
  <link rel="stylesheet" href="../../style.css" />
  <style>
    details {
      background: #2c2c2c;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
    }
    summary {
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
    }
    summary::-webkit-details-marker {
      display: none;
    }
    summary::before {
      content: "▶️ ";
      display: inline-block;
      margin-right: 0.5rem;
      transform: rotate(0deg);
      transition: transform 0.2s ease;
    }
    details[open] summary::before {
      content: "🔽 ";
    }
  </style>
</head>
<body>
  <div class="player-container">
    <h1>Rutina Vocal de Lupe</h1>
    <p id="customMessage" style="margin-bottom: 1rem; font-size: 1.1rem;"></p>
    
    <select id="trackSelect"></select>
    <audio id="audioPlayer" controls controlsList="nodownload"></audio>
    
    <div class="skip-controls">
      <button id="rewindBtn">⏪ -5s</button>
      <button id="forwardBtn">+5s ⏩</button>
    </div>

    <div class="controls">
      <label for="speedSlider">Velocidad:</label>
      <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1" />
      <span id="speedLabel">1.0x</span>
      <button id="resetSpeedBtn" title="Volver a velocidad normal">Resetear velocidad</button>
    </div>

  </div>

  <script src="../../main.js"></script>
</body>
</html>
